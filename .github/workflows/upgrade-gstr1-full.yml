name: Upgrade GSTR-1 Full Module

on:
  push:
    branches: [main]
    paths:
      - 'src/components/Gstr1ReportView.tsx'
      - 'src/components/Gstr1AdvancedView.tsx'
      - 'src/services/gstr1AdvancedService.ts'
      - 'scripts/upgrade-gstr1-full.cjs'
      - '.github/workflows/upgrade-gstr1-full.yml'

permissions:
  contents: write

jobs:
  upgrade:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Wire Full GSTR-1 UI
        run: node scripts/upgrade-gstr1-full.cjs

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Commit wiring changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/Gstr1ReportView.tsx
          if git diff --cached --quiet; then
            echo "No wiring changes needed"
          else
            git commit -m "Wire full GSTR-1 sections [skip ci]"
            git push
          fi
